[build-system]
requires=[
	"setuptools>=77.0.0",
	"versioningit",
]
build-backend = "setuptools.build_meta"

[project.urls]
"Homepage" = "https://github.com/ale94mleon/BindFlow"
"Discussions" = "https://github.com/ale94mleon/BindFlow/discussions"
"Documentation" = "https://BindFlow.readthedocs.io/en/latest/"
"Issues" = "https://github.com/ale94mleon/BindFlow/issues"

[project]
name = "bindflow"
dynamic = ["version"]
description = "A snakemake-based workflow for binding free energy calculations using GROMACS."
readme = "README.rst"
license-files = ["LICENSE"]

authors=[
    {name="Alejandro Martínez León", email="ale94mleon@gmail.com"},
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry"
]
keywords = [
    "science",
    "chemistry",
    "biology",
    "drug-design"
]

requires-python = ">= 3.11, < 3.13"
# No runtime dependencies are declared on purpose. They come from the conda environment files in
# install/envs (the installer installs BindFlow with pip --no-deps), and several are not on PyPI
# (GROMACS, AmberTools, the pinned MDRestraintsGenerator, gmx_MMPBSA, the BindFlow-TOFF environment).
# Declaring them here would let a pip install without --no-deps replace conda packages, and a second
# list drifts from the environment files. BindFlow checks its environment at run time instead
# (bindflow/_env_check.py).
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "alchemtest"]

[tool.pytest.ini_options]
markers = [
    "gromacs: runs real GROMACS simulations (minutes); deselect with -m 'not gromacs'",
]

[tool.versioningit]
default-version = "1+unknown"

[tool.versioningit.format]
distance = "{base_version}.post{distance}"
dirty = "{base_version}.post{distance}.dev0"
distance-dirty = "{base_version}.post{distance}.dev0"


[tool.versioningit.vcs]
method = "git" 
match = ["*"]
default-tag = "0.0.0"

[tool.versioningit.write]
file = "src/bindflow/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bindflow = [
    "data/gmx_ff/*.tar.gz",
    "data/gmx_water_models/*/*.itp",
    "data/gmx_water_models/*/*.dat",
    "data/gmx_water_models/*.yml",
    "data/gmx_water_models/configurations/*.gro",
    "data/ci_systems/**/*.yml",
    "data/ci_systems/**/*.tar.gz",
    "mdp/templates/**/*.mdp",
    "mmpbsa_in/templates/*.in",
    "rules/**/*.smk",
    "rules/**/Snakefile"
]

[project.scripts]
bindflow = "bindflow.cli:main"


# Codacy reads the configuration of ruff, and of no other Python linter, from this file.
# D212 and D415 keep the docstrings uniform and the numpy convention leaves them off.
[tool.pydocstyle]
convention = "numpy"
add-select = "D212,D415"

[tool.ruff]
line-length = 127
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "D"]
extend-select = ["D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# The docstring rules are for the package, not for the tests and the scripts.
[tool.ruff.lint.per-file-ignores]
"src/bindflow/tests/**" = ["D"]
"Contrib/**" = ["D"]
"streamlit/**" = ["D"]