# Install BindFlow with install/installer.sh on every supported platform and run the light tests.
#
# What is tested here:
#   - installer.sh end to end, including its own check (imports, ethane with every force field)
#   - the small-molecule parameterization tests (test_small.py)
# What is NOT tested here: test_fep.py and test_mmpbsa.py. They run real GROMACS simulations,
# which take too long on the hosted runners; run them locally before a release
# (pytest --pyargs bindflow.tests). GROMACS is therefore not installed in this workflow.
name: Test installation

on:
  push:
    branches: [main]
    paths:
      - "install/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/test-installation.yml"
  pull_request:
    paths:
      - "install/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/test-installation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            espaloma: true
          - name: Linux ARM
            os: ubuntu-24.04-arm
            espaloma: false   # dgl (Espaloma) is not built for linux-aarch64
          - name: macOS Apple Silicon
            os: macos-latest
            espaloma: true
          - name: macOS Intel
            os: macos-15-intel
            espaloma: true
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versioningit needs the tags to compute the version

      - name: Install micromamba
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  plat=linux-64 ;;
            Linux-aarch64) plat=linux-aarch64 ;;
            Darwin-arm64)  plat=osx-arm64 ;;
            Darwin-x86_64) plat=osx-64 ;;
            *) echo "Unsupported platform $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local"
          curl -fsSL "https://micro.mamba.pm/api/micromamba/${plat}/latest" | tar -xj -C "$HOME/.local" bin/micromamba
          echo "MAMBA_EXE=$HOME/.local/bin/micromamba" >> "$GITHUB_ENV"
          echo "MAMBA_ROOT_PREFIX=$HOME/micromamba" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run installer
        id: installer
        run: |
          extra=()
          [[ "${{ matrix.espaloma }}" == "true" ]] && extra+=(--espaloma)
          bash install/installer.sh --editable . --mmpbsa ${extra[@]+"${extra[@]}"}

      - name: Install pytest
        run: micromamba install -n BindFlow -c conda-forge --override-channels -y pytest

      # test_fep and test_mmpbsa are excluded: they run full GROMACS simulations (see top of file)
      - name: Run light tests
        run: >-
          micromamba run -n BindFlow python -m pytest --pyargs bindflow.tests -v -rsx
          -k "not test_fep and not test_mmpbsa"

      - name: Environment details
        if: always()
        run: |
          for env in BindFlow BindFlow-TOFF; do
            echo "::group::$env"
            micromamba list -n "$env" || true
            echo "::endgroup::"
          done

      # OpenFF runs antechamber itself and reports only its exit code, so a GAFF failure in the
      # installer's smoke test does not say why. This step runs antechamber directly on ethane,
      # the same way OpenFF does, and prints its output and sqm's files (sqm computes the AM1 charges).
      - name: Diagnose antechamber (only if the installer failed)
        if: failure() && steps.installer.outcome == 'failure'
        run: |
          env_run() { micromamba run -n BindFlow-TOFF "$@"; }
          if ! micromamba env list | grep -q "BindFlow-TOFF"; then
            echo "BindFlow-TOFF was not created; nothing to diagnose."; exit 0
          fi
          work="$(mktemp -d)"; cd "$work"
          echo "::group::AmberTools packages and sqm binary"
          micromamba list -n BindFlow-TOFF | grep -Ei "ambertools|libgfortran|openmmforcefields|openff-toolkit" || true
          sqm="$(env_run which sqm || true)"; echo "sqm: $sqm"
          if [[ -n "$sqm" && "$(uname -s)" == "Darwin" ]]; then otool -L "$sqm" || true; fi
          if [[ -n "$sqm" && "$(uname -s)" == "Linux" ]]; then ldd "$sqm" || true; fi
          echo "::endgroup::"
          # Ethane with 3D coordinates, written by RDKit as OpenFF would do
          env_run python -c "
          from rdkit import Chem
          from rdkit.Chem import AllChem
          m = Chem.AddHs(Chem.MolFromSmiles('CC')); AllChem.EmbedMolecule(m, randomSeed=1)
          Chem.MolToMolFile(m, 'molecule.sdf')"
          # Same command as OpenFF, but -pf no keeps the intermediate files (sqm.in, sqm.out, ...)
          status=0
          env_run antechamber -i molecule.sdf -fi sdf -o charged.mol2 -fo mol2 -pf no -dr n -c bcc -nc 0.0 || status=$?
          echo "antechamber exit code: $status"
          for f in sqm.in sqm.out sqm.pdb charged.mol2; do
            if [[ -f "$f" ]]; then echo "::group::$f"; cat "$f"; echo "::endgroup::"; fi
          done
          ls -la "$work"

